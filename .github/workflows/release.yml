name: Release

# Publishes a GitHub Release for this repo. Triggered by pushing a version tag
# (vX.Y.Z, e.g. v0.2.0) — see docs/distribution.md's "Release checklist" and
# "Follow-ups this decision implies" (NCOW-10.2) for the decision record this
# workflow implements. Also runnable by hand via workflow_dispatch for a dry
# run against an already-pushed tag (does not create a new tag).
#
# electron-builder can only build a given platform's installer targets on
# that platform (an NSIS .exe cannot be produced on macOS/Linux, a signed-ish
# .dmg cannot be produced on Linux/Windows), so this uses one job per OS
# runner rather than trying to cross-build everything from one machine —
# npm run dist locally cross-builds macOS+Windows+Linux targets from macOS,
# but CI intentionally does not rely on that; each job below builds and
# publishes only its own platform's artifacts, exactly like `npm run
# dist:mac` / `dist:win` / `dist:linux` do locally. This includes linux-arm64
# (NCOW-25): it gets its own job on a native arm64 runner rather than being
# cross-built from the x64 Linux job, for the same "build on the real target"
# reasoning as the macOS/Windows split — see docs/distribution.md's "Linux
# arm64 target (NCOW-25)" section for the full decision record.
#
# electron-builder's GitHub publisher looks up (or creates) a release by tag
# name and appends assets to it, so every job safely publishes into the
# same release for the same tag. By default a release it creates is a draft;
# the finalize job below adds a SHA256SUMS file once all platforms have
# uploaded, then flips the release out of draft so electron-updater's
# `/releases/latest` lookup (and the update checker in docs/auto-update.md)
# can actually find it — a draft release is invisible to that endpoint.
#
# Builds are UNSIGNED (no code-signing certs yet — see docs/distribution.md's
# "Signing reality" section), so there is deliberately no signing step here.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  # electron-builder's GitHub publisher does NOT target the git tag that
  # triggered the build — verified directly against a real run of this
  # workflow (electron-publish/out/gitHubPublisher.js: `this.tag =
  # githubTagPrefix(info) + version`, where `version` is read from
  # package.json). It always targets a release named "v<package.json
  # version>". Push a tag that doesn't match package.json's current version
  # and the build still succeeds, but silently publishes to a DIFFERENT
  # release than the one just tagged — worse, if package.json's version is
  # still the last real release's version, that's exactly the real release
  # it'll land on. This job fails the whole run fast, before any build/test
  # time is spent, if the two don't match.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve and verify tag matches package.json version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED="v${PKG_VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag '$TAG' does not match package.json's version '$PKG_VERSION' (expected tag '$EXPECTED'). electron-builder's GitHub publisher always targets a release named after package.json's version, not the git tag that triggered the build, so this mismatch would silently publish to the wrong release. Bump package.json's version to match before tagging."
            exit 1
          fi
          echo "Tag $TAG matches package.json version $PKG_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pre-create the draft release (avoids a real, observed race)
        # electron-builder's GitHub publisher does getOrCreateRelease() per
        # process, and its "or-create" half is not safe across concurrent
        # processes: a real run of this workflow, before this step existed,
        # had all three matrix jobs call it around the same time for the
        # same tag and ended up creating TWO separate draft release objects
        # for that one tag instead of one — GitHub does not enforce
        # uniqueness on a draft's tag_name. Assets split across the two
        # (observed: macOS's dmg/zip/blockmap/latest-mac.yml landed on one,
        # Linux's AppImage and macOS's zip.blockmap on the other), and the
        # zip.blockmap that landed on the "wrong" one was uploaded under its
        # raw on-disk name (with a space) instead of the safe dashed name,
        # which GitHub's own upload API then silently mangled to a period —
        # the exact asset-naming footgun this whole workflow exists to
        # avoid, just reached by a different road (a publish race, not a
        # manual/web upload). Creating the release once, here, before any
        # build job starts, means every build job's getOrCreateRelease()
        # finds this one already-existing draft and reuses it — the "get"
        # half of that function is a simple, race-free list-and-match.
        run: |
          if gh release view "${{ steps.resolve.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.resolve.outputs.tag }} already exists, reusing it."
          else
            gh release create "${{ steps.resolve.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --draft \
              --title "${{ steps.resolve.outputs.tag }}" \
              --notes "Building…"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_script: dist:mac
          - os: windows-latest
            build_script: dist:win
          - os: ubuntu-latest
            build_script: dist:linux:x64
          # linux-arm64 (NCOW-25): built on a *native* arm64 runner rather than
          # cross-compiled from ubuntu-latest (x64). GitHub's own arm64-hosted Ubuntu
          # runners (ubuntu-24.04-arm / ubuntu-22.04-arm) are GA and free for public
          # repos as of 2025-08 — see docs/distribution.md's "Linux arm64 target
          # (NCOW-25)" section for the full decision record, including why native
          # beats cross-compiling here (no QEMU, no risk of electron-builder's
          # documented arm64-cross-build footgun, and it matches this workflow's
          # existing philosophy of one job per real target rather than one machine
          # cross-building everything).
          - os: ubuntu-24.04-arm
            build_script: dist:linux:arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish (${{ matrix.os }})
        # Reuses this repo's own dist:mac/dist:win/dist:linux scripts (see
        # package.json) rather than re-deriving electron-builder flags here,
        # so CI and a local `npm run dist:mac` stay in lockstep. `--publish
        # always` is electron-builder's own GitHub-Releases publisher: it
        # uploads using each artifact's dash-normalized "safe" name (matching
        # what latest*.yml already records), not the raw on-disk filename
        # (which has spaces) — the same mechanism the release checklist in
        # docs/distribution.md recommends instead of a manual/web upload.
        run: npm run ${{ matrix.build_script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download release assets
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            release-assets/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish release (undraft)
        # Notes text lives in a checked-in file (.github/release-notes-template.md)
        # rather than inline here, so it's easy to review/edit without fighting
        # YAML block-scalar indentation.
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --notes-file .github/release-notes-template.md
