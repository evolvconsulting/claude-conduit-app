# Packaging config for unsigned, personal-distribution builds. Lives here
# rather than in package.json's "build" key so the reasoning below can be
# recorded — electron-builder's schema rejects unknown "//" comment keys.
#
# Icons come from build/icon.{icns,ico,png}, all generated from build/icon.svg
# by `npm run icons`.

appId: com.evolvconsulting.claudeconduit
productName: Claude Conduit

directories:
  output: dist
  buildResources: build

# An allowlist, not a denylist. package.json and production node_modules are
# always included, so naming src/ explicitly is what keeps test/, backlog/,
# docs/, scripts/, DESIGN.md — and critically the gitignored .env holding a
# real NVIDIA API key — out of every artifact. The .env negations are belt and
# braces on top of that.
files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/.env"
  - "!**/.env.*"

asar: true

# pm2 starts its daemon by spawning a real script path (God/Daemon.js). Paths
# inside app.asar are readable via fs but cannot be executed as a child
# process, so without this the proxy could never start from a packaged build.
asarUnpack:
  - "**/node_modules/pm2/**"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Ad-hoc signature. No paid Apple Developer ID is assumed, but a completely
  # unsigned binary will not launch *at all* on Apple Silicon. Ad-hoc satisfies
  # that while still tripping Gatekeeper on first open — hence the README's
  # System Settings -> Privacy & Security -> Open Anyway / xattr workaround.
  identity: "-"
  hardenedRuntime: true
  # Without disable-library-validation an ad-hoc-signed hardened-runtime app
  # refuses to load Electron's own dylibs and will not launch. See the file.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]

dmg:
  title: Claude Conduit ${version}

win:
  icon: build/icon.ico
  # NCOW-57: `portable` installs no Start Menu shortcut at all (electron-builder's
  # own glossary: "runs directly without writing to the registry or creating
  # Start menu entries"), and Electron's notifications doc says Windows toasts
  # need exactly such a shortcut carrying an AppUserModelID + ToastActivatorCLSID
  # — on paper, a reason `portable` could behave worse than `nsis` (whose
  # installer writes that shortcut+AUMID itself via `WinShell::SetLnkAUMI`).
  # Live-verified on winvm instead of accepted on that reasoning alone: both a
  # silently-installed `nsis` build and the standalone `portable` exe were run
  # (`--dev` + `NIM_PROXY_TEST_HOME`), and the tray's real onStart() failure
  # path was invoked in each real, running, packaged process (Node inspector
  # attached to the main process; `app.isPackaged` confirmed `true` in both).
  # Both produced IDENTICAL results at the one level this VM could confirm
  # objectively: Windows accepted the Notification call and recorded it under
  # the SAME per-app entry (`HKCU\...\Notifications\Settings\electron.app.Claude
  # Conduit` — Electron's own default AUMID, derived from productName, not
  # from anything a Start Menu shortcut provides), with `LastNotificationAddedTime`
  # advancing to match each test's timestamp for both configurations equally.
  # No portable-specific degradation was observed at that level — the
  # shortcut/CLSID requirement documented above appears to matter for toast
  # *activation* (clicking it to refocus a not-currently-running app), which
  # this app's simple informational notifyFailure() calls don't use, not for
  # whether the toast is created and accepted at all. Pixel-level "did a
  # banner actually render on screen" could NOT be confirmed for either
  # configuration in this VM despite repeated attempts (single screenshots, an
  # 8-10 frame burst spanning the toast's expected banner duration, opening
  # Notification Center, and minimizing every window first to rule out
  # fullscreen-app suppression) — plausibly a limitation of this VM's display/
  # compositor rather than of either build target, but not independently
  # confirmed either. Net: no code-level exclusion for `portable` — nothing
  # observed singles it out — and the tray's console.error diagnostic trail
  # (tray.js) fires unconditionally regardless, so a wedged Start/Stop/Restart
  # is never silent even if a given desktop suppresses the toast banner itself.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # A per-user install needs no admin elevation, which matters a lot for an
  # unsigned app that already has to talk the user past SmartScreen.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Development
  # Linux desktop environments can only associate the running window with this
  # .desktop entry when the entry's StartupWMClass matches the window's
  # app_id/WM_CLASS. That matters here because closing the window only hides it
  # — the user needs the taskbar/dock entry to map back to the app to restore
  # it. electron-builder 26 removed the top-level `desktopName` key (its
  # LinuxConfiguration schema is additionalProperties:false, so leaving it in
  # place fails validation and no artifact builds at all); the desktop file is
  # named from the executable, and entry overrides go here instead.
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: claude-conduit
  maintainer: evolv consulting <info@evolvconsulting.com>
  synopsis: GUI manager for a local LiteLLM proxy routing Claude Desktop and the Claude Code CLI through NVIDIA NIM models
  # arm64 added under NCOW-25: every Linux machine this project's maintainer owns is
  # aarch64, so an x64-only artifact could never be run, smoke-tested or verified on any of
  # them. This app has no native (node-gyp-compiled) dependencies — pm2, the only
  # asarUnpacked package, is pure JS end to end (verified: no `*.node` file anywhere in its
  # dependency tree) — so there is nothing here that needs a per-arch native rebuild, only
  # Electron's own prebuilt arm64 binary, which electron-builder downloads like any other
  # arch. electron-builder's own arch-suffix convention (`getArtifactArchName`/
  # `getArchPrefixForUpdateFile`) leaves x64 filenames and `latest-linux.yml` unchanged and
  # adds arm64-suffixed siblings (`*-arm64.AppImage`, `latest-linux-arm64.yml`) alongside
  # them, so existing x64 users and update metadata are unaffected by this addition.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
