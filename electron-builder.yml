# Packaging config for unsigned, personal-distribution builds. Lives here
# rather than in package.json's "build" key so the reasoning below can be
# recorded — electron-builder's schema rejects unknown "//" comment keys.
#
# Icons come from build/icon.{icns,ico,png}, all generated from build/icon.svg
# by `npm run icons`.

appId: com.evolvconsulting.claudeconduit
productName: Claude Conduit

directories:
  output: dist
  buildResources: build

# An allowlist, not a denylist. package.json and production node_modules are
# always included, so naming src/ explicitly is what keeps test/, backlog/,
# docs/, scripts/, DESIGN.md — and critically the gitignored .env holding a
# real NVIDIA API key — out of every artifact. The .env negations are belt and
# braces on top of that.
files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/.env"
  - "!**/.env.*"

asar: true

# pm2 starts its daemon by spawning a real script path (God/Daemon.js). Paths
# inside app.asar are readable via fs but cannot be executed as a child
# process, so without this the proxy could never start from a packaged build.
asarUnpack:
  - "**/node_modules/pm2/**"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Ad-hoc signature. No paid Apple Developer ID is assumed, but a completely
  # unsigned binary will not launch *at all* on Apple Silicon. Ad-hoc satisfies
  # that while still tripping Gatekeeper on first open — hence the README's
  # System Settings -> Privacy & Security -> Open Anyway / xattr workaround.
  identity: "-"
  hardenedRuntime: true
  # Without disable-library-validation an ad-hoc-signed hardened-runtime app
  # refuses to load Electron's own dylibs and will not launch. See the file.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]

dmg:
  title: Claude Conduit ${version}

win:
  icon: build/icon.ico
  # NCOW-57 fix pass: `portable` installs no Start Menu shortcut at all —
  # confirmed directly in this repo's own node_modules (`grep -rn
  # "SetLnkAUMI" node_modules/app-builder-lib/` returns hits only inside
  # `templates/nsis/include/installer.nsh`; none for `portable`). Electron's
  # notifications doc says Windows toasts need exactly such a shortcut
  # carrying an AppUserModelID (AUMID) + ToastActivatorCLSID — so `portable`
  # is missing the shortcut that carries BOTH ingredients, not merely one of
  # the two (wave-16 cleanup, F7: `CreateShortCut` appears only in
  # `app-builder-lib/templates/nsis/include/installer.nsh` across all of
  # `app-builder-lib/templates/`, and `templates/nsis/portable.nsi` has zero
  # `CreateShortCut`/`StartMenu` hits — portable creates no shortcut at all,
  # so neither ingredient has anywhere to attach), unconditionally, by
  # construction, regardless of anything this app's own code does. This is a
  # real, named, currently-unmitigated gap for `portable`, not something
  # ruled out by the live testing below.
  #
  # What changed this fix pass: `src/main/appUserModelId.js` now calls
  # `app.setAppUserModelId('com.evolvconsulting.claudeconduit')` —
  # this file's own `appId` — unconditionally on win32, packaged or not
  # (previously gated on `!isPackaged`, which left every packaged build,
  # `nsis` and `portable` alike, running under Electron's own generated
  # default AUMID instead). Re-verified live on winvm after that change,
  # covering three configurations: a silently-installed `nsis` build, the
  # standalone `portable` exe, and a genuine unpackaged `--dev` source run
  # (`node_modules\electron\dist\electron.exe . --dev`) — all launched with
  # `NIM_PROXY_TEST_HOME` set. For each, the tray's real onStart() failure
  # path was invoked in the real, running process via its V8 inspector
  # (mirroring `runAction()`'s catch branch with a rejecting fake
  # `handlers.proxy.start()`), so the exact production `Notification` call
  # fired for real.
  #
  # Observed, for all three configurations identically: (1) Electron passes
  # the running AUMID to its own child renderer process via an
  # `--app-user-model-id=` command-line switch — confirmed
  # `--app-user-model-id=com.evolvconsulting.claudeconduit` on every
  # renderer process's command line (nsis, portable, and source); (2) the
  # real Notification call landed in
  # `HKCU\Software\Microsoft\Windows\CurrentVersion\Notifications\Settings\
  # com.evolvconsulting.claudeconduit`, with `LastNotificationAddedTime`
  # advancing to match each test's timestamp; (3) that same string was
  # independently read back off the real, installed Start Menu shortcut
  # (`Claude Conduit.lnk`) via PowerShell's `Shell.Application` COM object's
  # `ExtendedProperty('System.AppUserModel.ID')`. All three now agree. Before
  # this fix pass, the packaged runtime AUMID (`electron.app.Claude Conduit`,
  # Electron's own generated default) did NOT match the shortcut's AUMID
  # (`com.evolvconsulting.claudeconduit`) at all — that mismatch is what this
  # fix closes for `nsis` and, for the runtime-AUMID value alone, `portable`
  # too.
  #
  # What this evidence can and cannot show: registry acceptance plus the
  # child-process AUMID switch prove the OS notification pipeline received
  # and recorded the call under the correct identity in all three
  # configurations — this instrument cannot, by itself, distinguish that from
  # a toast that was silently suppressed after being accepted (it cannot
  # prove a human would see a rendered banner, nor can it prove the reverse).
  # Pixel-level "did a banner actually render on screen" was attempted and
  # could not be confirmed in this VM in the prior pass (repeated screenshot
  # attempts); this pass did not re-attempt pixel capture, since what changed
  # is AUMID correctness, not display capability, and nothing about that
  # earlier limitation was expected to change. Separately: matching the
  # shortcut's AUMID also does not by itself prove toast *activation*
  # (clicking a toast to refocus/relaunch the app) will resolve correctly —
  # that additionally depends on a second, distinct API this app does not
  # call: `app.setToastActivatorCLSID(id)`. (Electron's own tutorial doc
  # actually frames the AUMID+CLSID pairing more broadly than activation
  # alone — see the re-verified reasoning below for the exact wording and
  # what that does and doesn't change here.)
  #
  # CCA-61 decided this deliberately, not by default: accept the gap and
  # document it accurately, rather than call `app.setToastActivatorCLSID()`
  # with a fixed value. The reasoning, re-verified against this repo's own
  # pinned versions (not carried forward from a prior task's citation):
  #
  # - Electron's own doc (docs/api/app.md, tag v43.2.0 — the version actually
  #   installed here, node_modules/electron/package.json — lines 1148-1159)
  #   states plainly: "If one is not set via this method, it will be
  #   randomly generated for the app... This method should be called early
  #   (before showing notifications) so the value is baked into the
  #   registration/shortcut... If this method is never called, a random
  #   CLSID is generated once per run and exposed via
  #   `app.toastActivatorCLSID`." So today, every run of this app gets a
  #   fresh random CLSID; nothing is broken by that alone.
  # - Electron's own `docs/tutorial/notifications.md` (same v43.2.0 tag,
  #   lines 100-101) states the requirement more broadly than "activation
  #   alone": "For notifications on Windows, your Electron app needs to have
  #   a Start Menu shortcut with an AppUserModelID and a corresponding
  #   ToastActivatorCLSID." That ties the CLSID to Windows notifications
  #   generally, not just the click-through path — broader than this
  #   comment's earlier "activation" framing (which follows
  #   `setToastActivatorCLSID`'s own, narrower doc instead, app.md lines
  #   1148-1159). What the live testing above can actually speak to:
  #   registry acceptance under the correct AUMID was confirmed on every
  #   configuration tried with no shortcut-side CLSID stamped at all — some
  #   evidence the pipeline still accepts calls without one — but
  #   pixel-level "did a banner render" was never confirmed either way (see
  #   above), so that can't settle whether plain display is affected by the
  #   missing CLSID. Left as an open question, not resolved in either
  #   direction here.
  # - electron-builder writes no ToastActivatorCLSID onto either Windows
  #   target's shortcut AT SHORTCUT-CREATION TIME — re-verified for CCA-61
  #   across the ENTIRE currently-installed app-builder-lib package
  #   (26.15.3), not just its `templates/nsis/` subdirectory: `grep -rn
  #   "ToastActivator\|CLSID" node_modules/app-builder-lib/` returns zero
  #   hits repo-wide. More specifically, the WinShell NSIS plugin this
  #   repo's own `installer.nsh` calls (see the `SetLnkAUMI` citation above)
  #   exposes exactly `SetLnkAUMI`, `UninstShortcut`, and
  #   `UninstAppUserModelId` — no shortcut-side CLSID-stamping call exists
  #   anywhere in the plugin surface these templates use. This bounds what
  #   the INSTALLER can stamp onto a shortcut at creation time only — it
  #   says nothing about whether the running app can update that same
  #   shortcut afterward.
  # - A remedy IS reachable regardless, independent of app-builder-lib:
  #   Electron itself can stamp a CLSID onto an already-installed shortcut
  #   at runtime via `shell.writeShortcutLink(shortcutPath, 'update',
  #   { toastActivatorClsid })` — `docs/api/shell.md` (same tag, lines
  #   97-105) documents `update` as "Updates specified properties only on
  #   an existing shortcut," and `docs/api/structures/shortcut-details.md`
  #   (same tag) documents `toastActivatorClsid` as "The Application Toast
  #   Activator CLSID. Needed for participating in Action Center." Nothing
  #   about app-builder-lib's installer-time gap above blocks this
  #   runtime-side call — it is a genuine, currently-reachable path, not a
  #   theoretical one.
  # - The gap is being ACCEPTED anyway, on cost/benefit grounds — not
  #   because no remedy exists. The full remedy would need: (a) locating the
  #   actual installed shortcut path at runtime; (b) calling
  #   `writeShortcutLink` to stamp a fixed CLSID onto it; and (c) almost
  #   certainly registering a COM server for that CLSID — Windows' contract
  #   requires a stamped CLSID to correspond to a REGISTERED COM activator,
  #   and it is NOT clear from Electron's docs alone whether
  #   `setToastActivatorCLSID` handles that registration itself or whether
  #   more registry/native work is needed (Electron's own notifications doc
  #   separately notes that even its "advanced," interactive-reply
  #   notifications need a distinct userland module,
  #   `electron-windows-interactive-notifications`, which "helps with
  #   registering the required COM components" — suggestive that COM
  #   registration isn't automatic, but not proof either way for the plain
  #   activation case here; left as an open, unverified question rather than
  #   a claim in either direction). (d) Real Windows testing has already
  #   proven expensive/limited on this campaign's available VM: NCOW-57's
  #   own history shows pixel-level toast verification proved unobtainable
  #   there across multiple repeated strategies.
  # - Given all that cost, and that this app's `notifyFailure()` calls are
  #   simple informational toasts that don't register an activation handler
  #   at all today, the cost is disproportionate to the benefit — a
  #   legitimate reason to accept the gap, distinct from "no remedy exists."
  #   It remains a real, open, and now-accurately-documented gap (see also
  #   `src/main/tray.js`'s own gap enumeration), not something ruled out or
  #   silently assumed unfixable.
  #
  # `portable`'s still-open gap, restated precisely: its runtime AUMID is now
  # correct (matches `nsis`'s shortcut AUMID, confirmed live above), but it
  # still has no Start Menu shortcut for that AUMID to be *paired* with —
  # setting the running process's AUMID cannot retroactively create a
  # shortcut that was never installed. Whatever role that pairing plays for
  # toast activation on Windows remains unmitigated for `portable` specifically.
  # The tray's console.error diagnostic trail (tray.js) fires unconditionally
  # regardless of any of the above, so a wedged Start/Stop/Restart is never
  # silent even if a given desktop or build target suppresses the toast itself.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # A per-user install needs no admin elevation, which matters a lot for an
  # unsigned app that already has to talk the user past SmartScreen.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Development
  # Linux desktop environments can only associate the running window with this
  # .desktop entry when the entry's StartupWMClass matches the window's
  # app_id/WM_CLASS. That matters here because closing the window only hides it
  # — the user needs the taskbar/dock entry to map back to the app to restore
  # it. electron-builder 26 removed the top-level `desktopName` key (its
  # LinuxConfiguration schema is additionalProperties:false, so leaving it in
  # place fails validation and no artifact builds at all); the desktop file is
  # named from the executable, and entry overrides go here instead.
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: claude-conduit
  maintainer: evolv consulting <info@evolvconsulting.com>
  synopsis: GUI manager for a local LiteLLM proxy routing Claude Desktop and the Claude Code CLI through NVIDIA NIM models
  # arm64 added under NCOW-25: every Linux machine this project's maintainer owns is
  # aarch64, so an x64-only artifact could never be run, smoke-tested or verified on any of
  # them. This app has no native (node-gyp-compiled) dependencies — pm2, the only
  # asarUnpacked package, is pure JS end to end (verified: no `*.node` file anywhere in its
  # dependency tree) — so there is nothing here that needs a per-arch native rebuild, only
  # Electron's own prebuilt arm64 binary, which electron-builder downloads like any other
  # arch. electron-builder's own arch-suffix convention (`getArtifactArchName`/
  # `getArchPrefixForUpdateFile`) leaves x64 filenames and `latest-linux.yml` unchanged and
  # adds arm64-suffixed siblings (`*-arm64.AppImage`, `latest-linux-arm64.yml`) alongside
  # them, so existing x64 users and update metadata are unaffected by this addition.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
